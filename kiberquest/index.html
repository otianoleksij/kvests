<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агенти КіберЩиту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: a blueprint-grid "agency HQ" — sticky console bar with key slots, one centered mission column below. */
:root{
  --paper:#EBF1F9; --surface:#FFFFFF; --ink:#14213A; --muted:#56668A; --line:#CCD7E8; --grid:rgba(45,85,224,.07);
  --accent:#2D55E0; --accent-deep:#1B3AA8; --accent-ink:#FFFFFF; --accent-soft:#E1E8FD;
  --signal:#FFC23D; --signal-ink:#14213A;
  --ok:#17905A; --ok-bg:#E0F4EA; --bad:#CF3F37; --bad-bg:#FBE6E4;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1423; --surface:#162036; --ink:#E6ECF8; --muted:#98A7C4; --line:#2A3854; --grid:rgba(125,155,255,.06);
    --accent:#7D9BFF; --accent-deep:#4C69D6; --accent-ink:#0D1423; --accent-soft:#1E2B4C;
    --signal:#FFD15C; --signal-ink:#14213A;
    --ok:#4CC98E; --ok-bg:#123327; --bad:#FF7B70; --bad-bg:#3B1C1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1423; --surface:#162036; --ink:#E6ECF8; --muted:#98A7C4; --line:#2A3854; --grid:rgba(125,155,255,.06);
  --accent:#7D9BFF; --accent-deep:#4C69D6; --accent-ink:#0D1423; --accent-soft:#1E2B4C;
  --signal:#FFD15C; --signal-ink:#14213A;
  --ok:#4CC98E; --ok-bg:#123327; --bad:#FF7B70; --bad-bg:#3B1C1F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  background-color:var(--paper); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:400 17px/1.55 var(--f-body);
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(30px,7vw,48px);font-weight:800}
h2{font-size:clamp(22px,4.6vw,30px);font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.lg{gap:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Console bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1.5px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px 14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--accent)}
.keys{display:flex;gap:5px;margin-left:auto}
.key{width:27px;height:32px;border:2px dashed var(--line);border-radius:7px;display:grid;place-items:center;font:700 15px var(--f-mono);color:var(--muted)}
.key.got{border-style:solid;border-color:var(--ink);background:var(--signal);color:var(--signal-ink)}
.meta{font:500 13px var(--f-mono);color:var(--muted);display:flex;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta b{color:var(--ink);font-weight:700}

main{padding-block:28px 56px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.panel.brief{border-style:dashed}
.brief ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:f}
.brief li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.brief li::before{content:counter(f);counter-increment:f;font:700 12px/26px var(--f-mono);text-align:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);height:26px}
.mhead{display:flex;gap:16px;align-items:center}
.mhead .ic{width:64px;height:64px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mhead .ic svg{width:36px;height:36px}

/* Buttons */
.btn{font:800 16px/1.2 var(--f-body);border:0;border-radius:12px;padding:13px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 3px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{font-size:14px;padding:9px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

label.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;flex:1 1 220px;min-width:0}
input[type=text]{font:600 17px var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input.mono{font-family:var(--f-mono);font-size:16px;letter-spacing:.02em}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 170px;gap:24px;align-items:center}
.villain{display:flex;flex-direction:column;align-items:center;gap:4px}
.villain svg{width:150px;height:150px}
.villain span{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.villain{flex-direction:row;justify-content:flex-start}.villain svg{width:84px;height:84px}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:15px;min-width:0}
.how b{display:block;font-family:var(--f-mono);font-size:22px;color:var(--accent);margin-bottom:2px}
@media (max-width:560px){.how{grid-template-columns:1fr}}

/* Mission map */
.map{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;color:var(--ink);font:inherit;width:100%}
button.mrow{cursor:pointer}
button.mrow:hover{border-color:var(--accent)}
.mrow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mrow .ic svg{width:24px;height:24px}
.mrow.locked{opacity:.55}
.mrow.locked .ic{background:var(--paper);color:var(--muted)}
.mrow.done .ic{background:var(--ok-bg);color:var(--ok)}
.mrow .t{min-width:0}
.mrow .t small{display:block;font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mrow .t span{font-weight:800;font-size:17px}
.chip{font:700 12px var(--f-mono);padding:5px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.chip.go{background:var(--accent);color:var(--accent-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.lock{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* Tasks */
.qtext{font-size:19px;font-weight:800;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.opts.grid{grid-template-columns:1fr}}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:flex-start;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 16px/1.4 var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.card{flex-direction:column;align-items:stretch;padding:10px;gap:8px;min-width:0}
.opt .mark{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-mono);margin-top:-2px}
.opt.multi .mark{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .mark{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{background:var(--bad);color:var(--surface);border-color:var(--bad)}

.fb{border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.fb h3{font-size:16px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}

/* Browser mockups (fixed light colours: they depict a web page) */
.bm{border:1.5px solid #CCD7E8;border-radius:10px;overflow:hidden;background:#FFFFFF;color:#14213A;font-size:13px;line-height:1.3;min-width:0}
.bm-bar{display:flex;gap:6px;align-items:center;background:#EEF1F6;padding:7px 8px;font:600 11.5px var(--f-mono);word-break:break-all}
.bm-bar svg{width:14px;height:14px;flex:none}
.bm-page{padding:12px;display:flex;flex-direction:column;gap:7px}
.bm-logo{font:800 15px var(--f-display);color:#2D55E0}
.bm-in{border:1px solid #CCD7E8;border-radius:6px;padding:5px 8px;color:#8A97B0;font-size:12px}
.bm-btn{background:#2D55E0;color:#FFFFFF;border-radius:6px;padding:6px;text-align:center;font-weight:800;font-size:12px}
.bm-ban{background:#FFC23D;color:#14213A;border-radius:6px;padding:5px;text-align:center;font-weight:800;font-size:12px}

/* Password lab */
.meter{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.meter i{height:10px;border-radius:3px;background:var(--line)}
.meter.l1 i:nth-child(-n+1),.meter.l2 i:nth-child(-n+2){background:var(--bad)}
.meter.l3 i:nth-child(-n+3),.meter.l4 i:nth-child(-n+4){background:var(--signal)}
.meter.l5 i:nth-child(-n+5){background:var(--accent)}
.meter.l6 i{background:var(--ok)}
.lvl{font:700 14px var(--f-mono)}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:15px}
@media (max-width:560px){.checks{grid-template-columns:1fr}}
.checks li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.checks li::before{content:"✗";font:700 14px/1.5 var(--f-mono);color:var(--bad);flex:none;width:14px}
.checks li.on{color:var(--ink)}
.checks li.on::before{content:"✓";color:var(--ok)}
.warn{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px}

/* Classify */
.cls{display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.ci.right{border-color:var(--ok)}
.ci.wrong{border-color:var(--bad)}
.ci .msg{min-width:0;display:flex;gap:10px;align-items:flex-start}
.ci .msg svg{width:30px;height:36px;flex:none;color:var(--accent)}
.ci .from{font:600 12px var(--f-mono);color:var(--muted);word-break:break-word}
.ci .txt{font-weight:700;word-break:break-word}
.ci .txt.file{font-family:var(--f-mono);font-size:15px}
.ci .ex{grid-column:1/-1;font-size:14px;color:var(--muted)}
.ci.right .ex::before{content:"✓ ";color:var(--ok);font-weight:800}
.ci.wrong .ex::before{content:"✗ ";color:var(--bad);font-weight:800}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:700 14px var(--f-body);padding:8px 12px;background:var(--surface);color:var(--ink);border:0;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.sel{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:default}
@media (max-width:560px){.ci{grid-template-columns:1fr}.seg{justify-self:start}}

/* Email hotspots */
.mail{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.mail-head{padding:12px 16px;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.mail-head div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mail-head span.l{font:600 12px var(--f-mono);color:var(--muted);width:44px;flex:none}
.mail-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.hs{display:inline;font:inherit;color:inherit;background:none;border:0;padding:1px 2px;border-radius:4px;text-align:left;cursor:pointer;border-bottom:1.5px dotted var(--line);word-break:break-word}
.hs:hover{background:var(--accent-soft)}
.hs.found{background:var(--signal);color:var(--signal-ink);border-bottom-color:transparent;cursor:default}
.hs.nope{background:var(--paper);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted);cursor:default}
.hs.missed{outline:2px dashed var(--bad);outline-offset:1px}
.hs sup{font:700 11px var(--f-mono);margin-left:2px}
.mono-sm{font-family:var(--f-mono);font-size:14px}
.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* Picture scenes */
.scene{border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#FFFFFF;line-height:0}
.scene svg{width:100%;height:auto;display:block;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scene.ended svg{cursor:default}
.slist{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.slist li::marker{font:700 13px var(--f-mono);color:var(--accent)}
.slist li.miss::marker{color:var(--bad)}

/* Privacy simulator */
.priv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.priv{grid-template-columns:1fr}}
.sets{padding:6px 16px}
.set{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set div{min-width:0}
.set b{display:block;font-size:15px}
.set small{display:block;font-size:13px;color:var(--muted)}
.set small.why{color:var(--bad);font-weight:700}
.set.right b{color:var(--ok)}
.set.wrong b{color:var(--bad)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:23px}
.sw:disabled{cursor:default;opacity:.8}
.pv{display:flex;flex-direction:column;gap:10px}
.pv-top{display:flex;gap:10px;align-items:center}
.pv-av{width:44px;height:44px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;font:800 18px var(--f-display);flex:none}
.pv ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pv li{background:var(--bad-bg);border-radius:8px;padding:6px 10px;font-weight:700}
.pv .safe{background:var(--ok-bg);border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
.pv-count{font:700 13px var(--f-mono)}

/* Chat simulator */
.chat{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat-top{background:var(--surface);border-bottom:1.5px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.chat-top .pv-av{width:36px;height:36px;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.chat-log{padding:14px;display:flex;flex-direction:column;gap:8px;max-height:430px;min-height:220px;overflow-y:auto}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.4;align-self:flex-start}
.bub small{display:block;font:700 11px var(--f-mono);color:var(--accent);margin-bottom:2px}
.bub svg{display:block;width:170px;max-width:100%;height:auto;border-radius:8px;margin-top:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:14px 14px 4px 14px}
.bub.me small{color:inherit;opacity:.8}
.bub.sys{align-self:center;background:transparent;border:0;font:700 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px}
.bub.note{align-self:stretch;max-width:none;background:var(--bad-bg);border-color:var(--bad);border-radius:10px;font-size:14px}
.typing{align-self:flex-start;font:700 13px var(--f-mono);color:var(--muted);padding:4px 8px}
.chat-ask{background:var(--surface);border-top:1.5px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chat-ask .opt{padding:10px 12px;font-size:15px}

/* Memory game */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{height:116px;border:0;padding:0;background:none;cursor:pointer;perspective:700px;font:inherit;color:inherit}
.mc-in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.matched .mc-in{transform:rotateY(180deg)}
.mc-f,.mc-b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;overflow:hidden}
.mc-b{background:var(--accent);color:var(--accent-ink);background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.08) 10px 20px)}
.mc-b svg{width:34px;height:34px}
.mc-f{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;line-height:1.25;color:var(--ink);word-break:break-word;hyphens:auto}
.mc-f.term{background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:800}
.mc.matched .mc-f{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.mc.matched{cursor:default}
@media (prefers-reduced-motion:reduce){.mc-in{transition:none}}

/* Order task */
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ord-i{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px}
.ord-n{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--f-mono)}
.ord-b{display:flex;gap:6px}
.ord-b button{width:42px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px}
.ord-b button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ord-b button:disabled{opacity:.3;cursor:default}
.ord-i.right{border-color:var(--ok)}
.ord-i.right .ord-n{background:var(--ok);color:var(--surface)}
.ord-i.wrong{border-color:var(--bad)}
.ord-i.wrong .ord-n{background:var(--bad);color:var(--surface)}
.ord-i small{grid-column:2/-1;font-size:13px;color:var(--bad)}

/* Word search */
.ws{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:470px;width:100%;margin:0 auto;user-select:none;-webkit-user-select:none}
.wc{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:800 clamp(13px,3.6vw,18px)/1 var(--f-body);cursor:pointer;padding:0;display:grid;place-items:center;min-width:0}
.wc:hover:not(:disabled){border-color:var(--accent)}
.wc:disabled{cursor:default}
.wc.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wc.f{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.wc.miss{border-color:var(--bad);color:var(--bad);border-style:dashed;border-width:2px}
.wc.bad{background:var(--bad-bg);border-color:var(--bad)}
.ws-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ws-words .chip{font-size:13px}
.ws-words .chip.ok{text-decoration:line-through}

/* Mission done + final */
.bigkey{width:96px;height:110px;border-radius:18px;background:var(--signal);color:var(--signal-ink);border:3px solid var(--ink);display:grid;place-items:center;font:800 54px var(--f-display);transform:rotate(-4deg)}
@media (prefers-reduced-motion:no-preference){.bigkey{animation:pop .5s ease-out}}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.1) rotate(2deg)}100%{transform:rotate(-4deg)}}
.center{text-align:center;align-items:center}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:52px;height:62px;border-radius:12px;border:2.5px solid var(--ink);background:var(--signal);color:var(--signal-ink);font:800 28px var(--f-display);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tile:disabled{opacity:.25;cursor:default}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:62px;border-radius:12px;border:2.5px dashed var(--line);display:grid;place-items:center;font:800 28px var(--f-display)}
.slot.f{border-style:solid;border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .4s}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Certificate */
.cert{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:28px 24px;overflow:hidden}
.cert::after{content:"";position:absolute;inset:8px;border:1.5px dashed var(--line);border-radius:12px;pointer-events:none}
.cert .who{font:800 clamp(24px,6vw,36px)/1.15 var(--f-display);word-break:break-word;padding-right:110px}
.stamp{position:absolute;right:18px;top:18px;width:96px;height:96px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;text-align:center;font:800 11px/1.25 var(--f-display);transform:rotate(12deg);padding:8px}
@media (max-width:560px){.stamp{position:static;transform:rotate(-6deg);margin-bottom:6px}.cert .who{padding-right:0}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.facts div{border-top:1.5px solid var(--line);padding-top:8px;min-width:0}
.facts small{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font:800 20px var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}}
.copybox{font:600 14px var(--f-mono);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all;word-break:break-word}

function tHotspots(t, area, finish){

  area.innerHTML='<div class="mail"><div class="mail-head">'+head+'</div><div class="mail-body">'+body+'</div></div>'+
    '<div class="row"><span class="lvl" id="hstat"></span><button class="btn ghost small" id="giveup">Показати решту</button></div><div class="muted" id="hmsg" style="font-size:15px;min-height:1.5em" aria-live="polite"></div>';
  var stat=document.getElementById("hstat"), msg=document.getElementById("hmsg");
  function upd(){ stat.textContent="Знайдено "+found+" з "+total+" · Хибних кліків: "+wrong; }
  upd();
  function end(gaveUp){
    ended=true;
    area.querySelectorAll(".hs").forEach(function(b){ b.disabled=true; var p=parts[b.dataset.p]; if(p.clue && !b.classList.contains("found")) b.classList.add("missed"); });
    document.getElementById("giveup").remove(); msg.textContent="";
    var pts=Math.max(0, found-wrong);
    var list='<ol class="clues">'+parts.filter(function(p){return p.clue;}).map(function(p){return '<li>'+esc(p.clue)+'</li>';}).join("")+'</ol>';
    finish(pts, !gaveUp && wrong<=1, gaveUp?"Розслідування завершено":"Усі ознаки знайдено!", (gaveUp?"Пропущені ознаки обведено червоним пунктиром. ":"")+"Ось усі ознаки "+(t.listTitle||"фішингу в цьому листі")+":"+list);
  }
  area.querySelectorAll(".hs").forEach(function(b){ b.addEventListener("click",function(){
    if(ended || b.classList.contains("found") || b.classList.contains("nope")) return;
    var p=parts[b.dataset.p];
    if(p.clue){ found++; b.classList.add("found"); b.insertAdjacentHTML("beforeend","<sup>"+found+"</sup>"); msg.textContent="Знайдено: "+p.clue; }
    else { wrong++; b.classList.add("nope"); msg.textContent="Тут нічого підозрілого. Шукай далі!"; }
    upd();
    if(found===total) end(false);
  }); });
  document.getElementById("giveup").addEventListener("click",function(){ end(true); });
}

function tChat(t, area, finish){
  area.innerHTML='<div class="chat"><div class="chat-top"><div class="pv-av">6-Б</div><div><b>'+esc(t.title)+'</b><div class="muted" style="font-size:13px">'+esc(t.sub)+'</div></div></div>'+
    '<div class="chat-log" id="log" aria-live="polite"></div><div class="chat-ask" id="ask" hidden></div></div>';
  var log=document.getElementById("log"), ask=document.getElementById("ask"), step=0, pts=0, firstTry=true;
  var D = reduced ? 150 : 850;
  function add(html, cls){ log.insertAdjacentHTML("beforeend",'<div class="bub '+(cls||'')+'">'+html+'</div>'); log.scrollTop=log.scrollHeight; }
  function msgHtml(m){ return '<small>'+esc(m.from)+'</small>'+esc(m.text)+(m.img?CHATPIC:''); }
  function typing(cb){ log.insertAdjacentHTML("beforeend",'<div class="typing" id="typ">друкує…</div>'); log.scrollTop=log.scrollHeight; later(function(){ var x=document.getElementById("typ"); if(x) x.remove(); cb(); }, D); }
  function playMsgs(arr, cb){
    var k=0;
    (function nx(){ if(k>=arr.length){ cb(); return; } var m=arr[k++]; typing(function(){ add(msgHtml(m)); nx(); }); })();
  }
  function run(){
    if(step>=t.script.length){ ask.hidden=true; var total=maxPts(t); finish(pts, pts===total, pts===total?"Справжній агент КіберЩиту!":"Історія завершилась добре", "Ти зупинив(-ла) цькування, підтримав(-ла) Дена і дав(-ла) йому правильну пораду. Перший вибір з першої спроби: "+pts+" з "+total+"."); return; }
    var s=t.script[step];
    if(s.sys){ add(esc(s.sys),"sys"); step++; later(run, D/2); return; }
    if(s.from){ typing(function(){ add(msgHtml(s)); step++; run(); }); return; }
    if(s.ask){
      firstTry=true;
      ask.hidden=false;
      ask.innerHTML='<b style="font-size:15px">'+esc(s.ask)+'</b>'+s.options.map(function(o,i){ return '<button class="opt" data-i="'+i+'"><span class="mark">'+LETTERS[i]+'</span><span>'+esc(o.t)+'</span></button>'; }).join("");
      ask.querySelectorAll(".opt").forEach(function(b){ b.addEventListener("click",function(){

          add('<small>Ти</small>'+esc(o.t),"me");
          step++;
          playMsgs(o.reply||[], function(){ later(run, D/2); });
        } else {
          firstTry=false; b.disabled=true; b.classList.add("wrong");
          add('<small>Ти</small>'+esc(o.t),"me");
          add('<b>Стоп!</b> '+esc(o.note),"note");
        }
      }); });
      log.scrollTop=log.scrollHeight;
      return;
    }
  }
  run();
}

function tOrder(t, area, finish){
  var n=t.items.length, ord, done=false;
  do { ord=shuffle(t.items.map(function(_,i){return i;})); } while(ord.some(function(v,i){return v===i;}) && Math.random()<0.85);
  if(ord.every(function(v,i){return v===i;})) ord.reverse();

    ol.innerHTML=ord.map(function(v,pos){
      var cls = done ? (v===pos?' right':' wrong') : '';
      return '<li class="ord-i'+cls+'"><span class="ord-n">'+(pos+1)+'</span><span class="ord-t">'+esc(t.items[v])+'</span>'+
        (done ? (v===pos?'':'<small>Має бути кроком №'+(v+1)+'</small>') :

    }).join("");

    var p=+b.dataset.p, mv=+b.dataset.mv, q=p+mv; if(q<0||q>=n) return;
    var x=ord[p]; ord[p]=ord[q]; ord[q]=x; draw({p:q,mv:mv});
  });
  draw();
  document.getElementById("chk").addEventListener("click",function(){
    done=true; var right=ord.filter(function(v,i){return v===i;}).length; draw();

      esc(t.explain)+'<ol class="clues" style="margin-top:8px">'+t.items.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>');
  });
}

function tWordsearch(t, area, finish){
  var N=10, ABC="АБВГДЕЖЗИІКЛМНОПРСТУФХЦЧШЮЯ", g=[], r, c, cellOwner={};
  for(r=0;r<N;r++){ g.push([]); for(c=0;c<N;c++) g[r].push(ABC.charAt(Math.floor(Math.random()*ABC.length))); }
  function cells(w){ var a=[]; for(var k=0;k<w.w.length;k++) a.push([w.r+(w.d==="v"?k:0), w.c+(w.d==="h"?k:0)]); return a; }
  t.words.forEach(function(w){ cells(w).forEach(function(p,k){ g[p[0]][p[1]]=w.w.charAt(k); }); });
  area.innerHTML='<div class="ws-words" id="wsw">'+t.words.map(function(w,k){return '<span class="chip lock" data-k="'+k+'">'+w.w+'</span>';}).join("")+'</div>'+
    '<div class="ws" id="ws">'+g.map(function(row,r){return row.map(function(ch,c){return '<button type="button" class="wc" data-r="'+r+'" data-c="'+c+'" aria-label="'+ch+', рядок '+(r+1)+', стовпець '+(c+1)+'">'+ch+'</button>';}).join("");}).join("")+'</div>'+
    '<div class="row" style="justify-content:center"><span class="lvl" id="wstat"></span><button class="btn ghost small" id="giveup">Показати решту</button></div>'+
    '<div class="muted" id="wmsg" style="font-size:15px;min-height:1.5em;text-align:center" aria-live="polite">Натисни на першу літеру слова, а потім — на останню.</div>';
  var grid=document.getElementById("ws"), msg=document.getElementById("wmsg"), stat=document.getElementById("wstat"), first=null, found=[], ended=false;
  function cell(r,c){ return grid.querySelector('[data-r="'+r+'"][data-c="'+c+'"]'); }
  function upd(){ stat.textContent="Знайдено слів: "+found.length+" з "+t.words.length; }
  upd();
  function end(gaveUp){
    ended=true; var gu=document.getElementById("giveup"); if(gu) gu.remove();
    t.words.forEach(function(w,k){ if(found.indexOf(k)<0) cells(w).forEach(function(p){ cell(p[0],p[1]).classList.add("miss"); }); });
    grid.querySelectorAll(".wc").forEach(function(b){ b.disabled=true; });
    msg.textContent="";
    finish(found.length, found.length===t.words.length, gaveUp?"Пошук завершено":"Усі слова знайдено!", gaveUp?"Слова, які ти не знайшов(-ла), обведено червоним пунктиром.":"Ти справжній знавець кіберслів!");
  }
  grid.addEventListener("click",function(e){
    var b=e.target.closest(".wc"); if(!b || ended) return;
    var R=+b.dataset.r, C=+b.dataset.c;
    if(!first){ first=[R,C]; b.classList.add("sel"); return; }
    var fb=cell(first[0],first[1]); fb.classList.remove("sel");
    if(first[0]===R && first[1]===C){ first=null; return; }
    var hit=-1;
    t.words.forEach(function(w,k){
      var cs=cells(w), s=cs[0], z=cs[cs.length-1];
      if((s[0]===first[0]&&s[1]===first[1]&&z[0]===R&&z[1]===C)||(z[0]===first[0]&&z[1]===first[1]&&s[0]===R&&s[1]===C)) hit=k;
    });
    first=null;
    if(hit>-1 && found.indexOf(hit)<0){
      found.push(hit); cells(t.words[hit]).forEach(function(p){ cell(p[0],p[1]).classList.add("f"); });
      var chip=document.querySelector('#wsw [data-k="'+hit+'"]'); chip.className="chip ok";
      msg.textContent="Знайдено: "+t.words[hit].w+"!"; upd();
      if(found.length===t.words.length) end(false);
    } else if(hit>-1){ msg.textContent="Це слово вже знайдено."; }
    else {
      msg.textContent="Тут немає слова зі списку. Спробуй ще!";
      [fb,b].forEach(function(x){ x.classList.add("bad"); }); later(function(){ fb.classList.remove("bad"); b.classList.remove("bad"); }, 500);
    }
  });
  document.getElementById("giveup").addEventListener("click",function(){ end(true); });
}

    '<div class="facts"><div><small>Звання</small><b>'+r+'</b></div><div><small>Бали</small><b>'+pts+' / '+TOTAL+'</b></div><div><small>Час</small><b>'+fmt(elapsed())+'</b></div></div>'+
  '</section>'+
  '<section class="panel stack"><h3>Здай результат учителю</h3><p class="muted" style="font-size:15px">Покажи цей екран учителю або скопіюй рядок нижче і встав його у форму на сторінці квесту.</p>'+
    '<div class="copybox" id="cbox">'+esc(line)+'</div>'+
    '<div class="row"><button class="btn small" id="copy">Скопіювати результат</button><span class="muted" id="cmsg" style="font-size:14px" aria-live="polite"></span></div></section>'+
  '<div class="row"><button class="btn ghost small" id="again">Пройти квест заново</button></div>';
  document.getElementById("copy").addEventListener("click",function(){
    var m=document.getElementById("cmsg");
    function sel(){ try{ var r=document.createRange(); r.selectNodeContents(document.getElementById("cbox")); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){} m.textContent="Текст виділено — натисни Ctrl+C (або Cmd+C)."; }
    try{ navigator.clipboard.writeText(line).then(function(){ m.textContent="Скопійовано!"; }, sel); }catch(e){ sel(); }
  });
  var ag=document.getElementById("again"), armed=false;
  ag.addEventListener("click",function(){
    if(!armed){ armed=true; ag.textContent="Точно? Результат зітреться. Натисни ще раз"; return; }
    var keep={name:S.name, cls:S.cls}; S=fresh(); S.name=keep.name; S.cls=keep.cls; go("start");
  });
}

render();
})();
</script>
</body>
</html>
